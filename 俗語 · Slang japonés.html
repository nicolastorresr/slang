n|ぐるぐる||girar, dar vueltas|1|Movimientos circulares o mareo.||頭がぐるぐる回る。|Atama ga guruguru mawaru.|La cabeza me da vueltas.
n|トントン||golpecitos suaves|1|Llamar a la puerta o palmaditas.||ドアをトントンと叩く。|Doa o tonton to tataku.|Llamo a la puerta con golpecitos.
n|ガヤガヤ||bullicio de multitud|1|Voces mezcladas en un lugar concurrido.||駅の中がガヤガヤしている。|Eki no naka ga gayagaya shiteiru.|La estación está bulliciosa.
n|ブツブツ||murmurar, quejarse|1|Hablar entre dientes.||ブツブツ文句を言う。|Butsubutsu monku o iu.|Murmura quejas.
n|ウトウト||dormitar|1|Quedarse medio dormido.||電車でウトウトした。|Densha de utouto shita.|Cabeceé en el tren.
n|ヒソヒソ||susurrar, cuchichear|1|Hablar en voz muy baja.||ヒソヒソ話している。|Hisohiso hanashiteiru.|Cuchichean.
n|ズキズキ||dolor punzante|1|Dolores que laten.||頭がズキズキする。|Atama ga zukizuki suru.|Me late dolorosamente la cabeza.
n|ヒリヒリ||escozor|1|Piel irritada o comida picante.||日焼けでヒリヒリする。|Hiyake de hirihiri suru.|Me escuece la quemadura.
n|フラフラ||mareado, tambaleante|1|Falta de equilibrio.||熱でフラフラだ。|Netsu de furafura da.|Estoy mareado por la fiebre.
n|バタバタ||ajetreado, correr de aquí para allá|1|Ritmo frenético o pasos fuertes.||朝はバタバタしている。|Asa wa batabata shiteiru.|Las mañanas son ajetreadas.`.trim().split("\n").map(l=>{const a=l.split("|");return{c:a[0],k:a[1],h:a[2],m:a[3],l:+a[4],n:a[5],t:a[6],e:a[7],r:a[8],s:a[9]}});
const kana=d=>d.h?d.h.replace(/ /g,""):"",rom=d=>ro((d.h||d.k).replace(/(^| )は(?= |$)/g,"$1わ")).replace(/\s+/g," ").trim();
const fs=k=>k.length>6?"1.1rem":k.length>3?"1.5rem":"2rem";
// ---- navegación
function tab(t){$$(".tab").forEach(b=>b.classList.toggle("on",b.dataset.t==t));["ex","qz"].forEach(x=>$("#"+x).hidden=x!=t);if(t=="qz")qset()}
$$(".tab").forEach(b=>b.onclick=()=>tab(b.dataset.t));
document.addEventListener("click",e=>{const c=e.target.closest(".c");if(c){c.classList.toggle("open");c.setAttribute("aria-expanded",c.classList.contains("open"))}});
document.addEventListener("keydown",e=>{if((e.key=="Enter"||e.key==" ")&&e.target.classList.contains("c")){e.preventDefault();e.target.click()}});
// ---- tarjetas
function card(d,open){const c=C[d.c];
 return`<div class="c ${open?"open":""}" style="--a:${c[2]}" tabindex="0" role="button" aria-expanded="${!!open}"><div class="top"><span class="ic">${c[1]}</span><div><b class="k jp" style="font-size:${fs(d.k)}">${d.k}</b><span class="r jp">${d.h?kana(d)+" · ":""}${rom(d)}</span></div><span class="lv l${d.l}">${LV[d.l][0]} ${LV[d.l][1]}</span></div><p class="m">${d.m}</p>${d.t?`<p class="lit">${d.t}</p>`:""}<div class="x"><p class="tip">${JW(d.n)}</p><span class="lb">EJEMPLO</span><div class="ex jp">${d.e}</div><i>${d.r}</i><div>${d.s}</div></div></div>`}
let cf="*",lf="*",qq="";
const chips=(arr,key,cur)=>arr.map(([k,t])=>`<button class="chip" ${k==cur?'style="background:var(--red);color:#fff;border-color:var(--red)"':""} data-${key}="${k}">${t}</button>`).join("");
function render(){
 $("#cf").innerHTML=chips([["*","✨ Todo"],...Object.entries(C).map(([k,v])=>[k,v[1]+" "+v[0]])],"c",cf);
 $("#lf").innerHTML=chips([["*","Todo registro"],...LV.map((v,i)=>[i,v[0]+" "+v[1]])],"l",lf);
 const q=qq.toLowerCase().trim(),L=D.filter(d=>(cf=="*"||d.c==cf)&&(lf=="*"||d.l==+lf)&&(!q||(d.k+kana(d)+rom(d)+d.m+(d.t||"")).toLowerCase().includes(q)));
 $("#cnt").textContent=L.length+" entradas";
 const ids=Object.keys(C).filter(k=>L.some(d=>d.c==k));
 $("#cards").innerHTML=L.length?ids.map(k=>{const c=C[k];return`<section style="--a:${c[2]}"><h2><span class="ic">${c[1]}</span>${c[0]}</h2><p class="pat">${JW(c[3])}</p><div class="grid">${L.filter(d=>d.c==k).map(d=>card(d)).join("")}</div></section>`}).join(""):`<p class="hint">Sin resultados. Prueba otra palabra o quita los filtros.</p>`;
 $$("[data-c]").forEach(b=>b.onclick=()=>{cf=b.dataset.c;render()});$$("[data-l]").forEach(b=>b.onclick=()=>{lf=b.dataset.l;render()})}
$("#q").oninput=e=>{qq=e.target.value;render()};
$("#ta").onclick=()=>{const all=$$("#cards .c"),open=all.some(c=>!c.classList.contains("open"));all.forEach(c=>c.classList.toggle("open",open));$("#ta").textContent=open?"Cerrar todas":"Abrir todas"};
$("#wod").innerHTML=`<span class="lb">PALABRA DEL DÍA</span>`+card(D[Math.floor(Date.now()/864e5)%D.length],1);
// ---- quiz
let qs={m:"mix",s:"*"},qi,sc,bad;
function qset(){
 $("#qa").innerHTML=`<h2 style="justify-content:center">Practica el slang</h2><p class="mut">Tipo de pregunta</p><div class="row">${chips([["mix","Mezcla"],["mean","Significado"],["read","Lectura"],["lit","Literal vs real"],["reg","Registro"]],"m",qs.m)}</div><p class="mut">Categoría</p><div class="row">${chips([["*","Todo"],...Object.entries(C).map(([k,v])=>[k,v[1]+" "+v[0]])],"s",qs.s)}</div><button class="go" id="st">Empezar · 10 preguntas</button>`;
 $$("#qa [data-m]").forEach(b=>b.onclick=()=>{qs.m=b.dataset.m;qset()});$$("#qa [data-s]").forEach(b=>b.onclick=()=>{qs.s=b.dataset.s;qset()});
 $("#st").onclick=()=>{qi=0;sc=0;bad=[];qnext()}}
function qnext(){
 if(qi>=10)return qend();
 const pool=D.filter(d=>qs.s=="*"||d.c==qs.s),ok={mean:1,reg:1,read:pool.some(d=>d.h),lit:pool.some(d=>d.t)};
 const m=qs.m=="mix"?pick(["mean","mean","read","lit","reg"].filter(x=>ok[x])):ok[qs.m]?qs.m:"mean";
 const d=pick(pool.filter(x=>m=="read"?x.h:m=="lit"?x.t:1)),near=shuf(D.filter(x=>x!=d&&x.c==d.c)),far=shuf(D.filter(x=>x!=d&&x.c!=d.c));
 const mk=(f,ans)=>{const o=[ans];[...near,...far].filter(x=>m=="read"?x.h:1).forEach(x=>{const v=f(x);if(o.length<4&&!o.includes(v))o.push(v)});return shuf(o).map(v=>[v,v])};
 let h,L,ans;
 const big=`<div class="big jp" style="font-size:${d.k.length>6?"1.6rem":d.k.length>3?"2.2rem":"3rem"}">${d.k}</div>`;
 if(m=="mean"){h=big+(d.h?`<div class="r jp">${kana(d)}</div>`:"")+`<p>¿Qué significa?</p>`;ans=d.m;L=mk(x=>x.m,ans)}
 else if(m=="read"){h=big+`<p>¿Cómo se lee?</p>`;ans=kana(d);L=mk(kana,ans)}
 else if(m=="lit"){h=`<p class="lit" style="font-size:1.3rem">${d.t}</p><p>Y en la práctica, ¿qué significa?</p>`;ans=d.m;L=mk(x=>x.m,ans)}
 else{h=big+`<p>¿Cuál es su registro?</p>`;ans=LV[d.l][2];L=LV.map(v=>[v[2],v[0]+" "+v[2]])}
 $("#qa").innerHTML=`<div class="bar"><i style="width:${qi*10}%"></i></div><p class="mut">Pregunta ${qi+1} de 10 · ${sc} correctas</p>${h}`+L.map(([v,t],j)=>`<button class="o jp" data-j="${j}">${t}</button>`).join("")+`<div class="fb" id="fb"></div><button class="go" id="nx" hidden>Siguiente</button>`;
 $$(".o").forEach(b=>b.onclick=()=>{const good=L[b.dataset.j][0]==ans;if(good)sc++;else bad.push(d.k+" = "+d.m);
  $$(".o").forEach(x=>{x.disabled=true;if(L[x.dataset.j][0]==ans)x.classList.add("ok")});if(!good)b.classList.add("bad");
  $("#fb").innerHTML=`<strong style="color:var(--${good?"ok":"bad"})">${good?"✔ ¡Correcto!":"✘ Casi"}</strong><b class="jp">${d.k}</b> ${d.h?"("+kana(d)+" · ":"("}${rom(d)}) = ${d.m} ${LV[d.l][0]}<br>${JW(d.n)}<br><span class="ex jp">${d.e}</span><br><i>${d.r}</i> · ${d.s}`;
  $("#nx").hidden=false;$("#nx").textContent=qi<9?"Siguiente":"Ver resultado";$("#nx").focus();$("#nx").onclick=()=>{qi++;qnext()}})}
function qend(){
 $("#qa").innerHTML=`<div class="sun jp">${sc}</div><h2 style="justify-content:center">${sc} de 10</h2><p>${sc>=9?"¡Hablas como local!":sc>=6?"Buen avance. Repasa lo que fallaste.":"Mira las tarjetas y vuelve a intentarlo."}</p>${bad.length?`<p class="lb">PARA REPASAR</p><p class="jp">${bad.join("<br>")}</p>`:""}<button class="go" id="again">Jugar de nuevo</button>`;
 $("#again").onclick=qset}
render();
</script></body></html>
